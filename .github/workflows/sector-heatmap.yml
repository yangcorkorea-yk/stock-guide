name: Daily — Sector Heatmap

on:
  schedule:
    # 매일 21:45 UTC = KST 06:45 (시장 브리핑 15분 후, 이벤트 브리핑 15분 전)
    - cron: "45 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate sector heatmap
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scripts/refresh_sector_heatmap.py

      - name: Commit JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/sector_heatmap.json)" ]; then
            git add data/sector_heatmap.json
            git commit -m "chore(data): refresh sector_heatmap [skip ci]"
            git push
          else
            echo "변경 없음."
          fi
